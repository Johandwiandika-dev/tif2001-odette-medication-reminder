name: Pemeriksaan Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Memeriksa susunan dan keamanan repository
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil kode repository
        uses: actions/checkout@v4

      - name: Memeriksa berkas wajib
        run: |
          test -f README.md
          test -f docs/api_specifications.md
          test -f docs/database_schema.sql
          test -f client/.env.example
          test -f server/.env.example
          test -f .github/workflows/frontend-ci.yml
          test -f .github/workflows/backend-ci.yml

      - name: Memastikan berkas rahasia tidak ikut tersimpan
        run: |
          if find . -path './.git' -prune -o -type f -name '.env' -print | grep -q .; then
            echo "Ditemukan berkas .env. Hapus dari repository dan gunakan konfigurasi rahasia."
            exit 1
          fi
          echo "Pemeriksaan repository berhasil."
