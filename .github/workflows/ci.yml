name: Pemeriksaan Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Memeriksa susunan repository
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil kode repository
        uses: actions/checkout@v4

      - name: Memeriksa berkas wajib
        run: |
          test -f README.md
          test -f docs/api_specifications.md
          test -f docs/database_schema.sql
          test -f client/.env.example
          test -f server/.env.example
          echo "Pemeriksaan susunan repository berhasil."
