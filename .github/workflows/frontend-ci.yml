name: Pemeriksaan Frontend

on:
  push:
    branches: [main, feature/fullstack-integration]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Memeriksa kode frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Mengambil kode repository
        uses: actions/checkout@v4

      - name: Menyiapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Memasang kebutuhan proyek
        run: npm ci

      - name: Memeriksa aturan penulisan kode
        run: npm run lint

      - name: Memeriksa kerapian format kode
        run: npm run format:check

      - name: Menjalankan pengujian frontend
        run: npm test -- --runInBand
