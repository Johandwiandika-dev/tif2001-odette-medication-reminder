name: Pemeriksaan Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Menguji dan memeriksa frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Mengambil kode repository
        uses: actions/checkout@v4

      - name: Menyiapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Memasang dependensi
        run: npm ci

      - name: Menjalankan pengujian unit
        run: npm test -- --runInBand

      - name: Memeriksa kualitas kode
        run: npm run lint

      - name: Memeriksa format kode
        run: npm run format:check
